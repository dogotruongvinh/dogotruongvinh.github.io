<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height Map CNC Pro - Xám Bạc Láng Bóng</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 340px;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #b0bec5;
        }
        .control-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #ccc;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #90a4ae;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .checkbox-group input {
            cursor: pointer;
            accent-color: #90a4ae;
            width: 16px;
            height: 16px;
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: #fff;
        }
        .btn-primary {
            background-color: #78909c !important;
            margin-bottom: 10px;
        }
        .btn-primary:hover {
            background-color: #607d8b !important;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #b0bec5;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cfd8dc;
        }
        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #b0bec5;
            font-weight: bold;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<!-- Thêm nút này vào ngay sau thẻ <body> -->
<a href="index.html" class="back-btn">⬅ Quay về Trang Chủ</a>

<style>
    .back-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000; /* Đảm bảo nằm trên các phần tử khác */
        background: #333;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 14px;
        border: 1px solid #555;
    }
    .back-btn:hover {
        background: #555;
        color: white;
    }
</style>


    
    <div id="controls">
        <h2>Silver Mirror CNC Pro</h2>
        
        <div class="control-group">
            <label for="imageLoader">1. Chọn ảnh Height Map:</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>

        <div class="control-group">
            <label for="resolution">2. Độ phân giải Lưới: <span id="resVal">1600</span></label>
            <input type="range" id="resolution" min="500" max="2500" value="1600" step="50">
        </div>

        <div class="control-group">
            <label for="depth">3. Độ sâu Z (Chiều cao phù điêu): <span id="depthVal">25</span></label>
            <input type="range" id="depth" min="5" max="100" value="25" step="5">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="smoothNoise" checked>
            <label for="smoothNoise">Khử sần & Láng bóng tuyệt đối</label>
        </div>

        <button id="processBtn" class="btn-primary" disabled>⚙️ Bấm Xử Lý Khối 3D</button>
        <button id="exportBtn" disabled>⚡ Tải xuống file STL Xám Bạc</button>
        
        <div id="loading">Đang tính toán tạo khối 3D...</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let mesh = null;
        let originalImgData = null, processedHeightMap = null, imgWidth = 0, imgHeight = 0;

        const imageLoader = document.getElementById('imageLoader');
        const resolutionSlider = document.getElementById('resolution');
        const depthSlider = document.getElementById('depth');
        const smoothNoiseCheckbox = document.getElementById('smoothNoise');
        const resVal = document.getElementById('resVal');
        const depthVal = document.getElementById('depthVal');
        const processBtn = document.getElementById('processBtn');
        const exportBtn = document.getElementById('exportBtn');
        const loading = document.getElementById('loading');

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, -250, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xaaaaaa);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(0, -200, 400);
            scene.add(directionalLight);

            const fillLight = new THREE.DirectionalLight(0x888888, 0.6);
            fillLight.position.set(0, 200, -200);
            scene.add(fillLight);

            resolutionSlider.addEventListener('input', (e) => { resVal.innerText = e.target.value; });
            depthSlider.addEventListener('input', (e) => { depthVal.innerText = e.target.value; });

            imageLoader.addEventListener('change', handleImage, false);
            processBtn.addEventListener('click', generate3D);
            exportBtn.addEventListener('click', exportSTLFast);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    imgWidth = img.width;
                    imgHeight = img.height;
                    
                    canvas.width = imgWidth;
                    canvas.height = imgHeight;
                    ctx.drawImage(img, 0, 0);
                    
                    const imgPixels = ctx.getImageData(0, 0, imgWidth, imgHeight);
                    originalImgData = imgPixels.data;

                    processBtn.disabled = false;
                    loading.style.display = 'block';
                    loading.innerText = 'Đã tải ảnh xong. Hãy bấm "Xử lý khối 3D"';
                    setTimeout(() => { loading.style.display = 'none'; }, 3000);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function precomputeHeightMap(enableSmooth) {
            const size = imgWidth * imgHeight;
            processedHeightMap = new Float32Array(size);

            const rawGray = new Float32Array(size);
            for (let i = 0; i < size; i++) {
                const idx = i * 4;
                rawGray[i] = (originalImgData[idx] * 0.299 + originalImgData[idx + 1] * 0.587 + originalImgData[idx + 2] * 0.114);
            }

            if (!enableSmooth) {
                processedHeightMap.set(rawGray);
                return;
            }

            let currentData = new Float32Array(rawGray);
            
            for (let pass = 0; pass < 2; pass++) {
                const tempData = new Float32Array(size);
                for (let y = 0; y < imgHeight; y++) {
                    for (let x = 0; x < imgWidth; x++) {
                        const idx = y * imgWidth + x;
                        const centerVal = currentData[idx];

                        let sum = 0;
                        let weightSum = 0;
                        const radius = 3;

                        for (let dy = -radius; dy <= radius; dy++) {
                            const ny = y + dy;
                            if (ny < 0 || ny >= imgHeight) continue;

                            for (let dx = -radius; dx <= radius; dx++) {
                                const nx = x + dx;
                                if (nx < 0 || nx >= imgWidth) continue;

                                const sampleVal = currentData[ny * imgWidth + nx];
                                const diff = Math.abs(sampleVal - centerVal);

                                const weight = diff < 40 ? Math.exp(-(dx * dx + dy * dy) / 6.0) : 0.005;

                                sum += sampleVal * weight;
                                weightSum += weight;
                            }
                        }
                        tempData[idx] = weightSum > 0 ? (sum / weightSum) : centerVal;
                    }
                }
                currentData = tempData;
            }

            processedHeightMap.set(currentData);
        }

        function getInterpolatedHeight(u, v) {
            const fx = u * (imgWidth - 1);
            const fy = (1 - v) * (imgHeight - 1);
            
            const x = Math.floor(fx);
            const y = Math.floor(fy);
            
            const xWeight = fx - x;
            const yWeight = fy - y;

            function getVal(px, py) {
                const cx = Math.max(0, Math.min(px, imgWidth - 1));
                const cy = Math.max(0, Math.min(py, imgHeight - 1));
                return processedHeightMap[cy * imgWidth + cx];
            }

            let totalVal = 0;
            let weightTotal = 0;

            for (let m = -1; m <= 2; m++) {
                for (let n = -1; n <= 2; n++) {
                    const val = getVal(x + n, y + m);

                    function cubicWeight(t) {
                        const absT = Math.abs(t);
                        if (absT <= 1) return (1.5 * absT - 2.5) * absT * absT + 1.0;
                        else if (absT < 2) return ((-0.5 * absT + 2.5) * absT - 4.0) * absT + 2.0;
                        return 0;
                    }

                    const weight = cubicWeight(n - xWeight) * cubicWeight(m - yWeight);
                    totalVal += val * weight;
                    weightTotal += weight;
                }
            }

            return weightTotal !== 0 ? (totalVal / weightTotal) : getVal(x, y);
        }

        function generate3D() {
            if (!originalImgData) return;
            loading.style.display = 'block';
            loading.innerText = '⚙️ Đang xử lý khối xám bạc láng bóng...';

            setTimeout(() => {
                if (mesh) {
                    scene.remove(mesh);
                    mesh.geometry.dispose();
                    mesh.material.dispose();
                }

                const segments = parseInt(resolutionSlider.value);
                const maxDepth = parseFloat(depthSlider.value);
                const isSmooth = smoothNoiseCheckbox.checked;

                precomputeHeightMap(isSmooth);

                const geometry = new THREE.PlaneGeometry(200, 200 * (imgHeight / imgWidth), segments, segments);
                const pos = geometry.attributes.position;

                for (let i = 0; i < pos.count; i++) {
                    const u = (pos.getX(i) / 200) + 0.5;
                    const v = (pos.getY(i) / (200 * (imgHeight / imgWidth))) + 0.5;

                    const gray = getInterpolatedHeight(u, v);
                    pos.setZ(i, (gray / 255) * maxDepth);
                }

                geometry.computeVertexNormals();

                // Màu xám bạc kim loại (Silver Metallic) với độ bóng cao
                const material = new THREE.MeshStandardMaterial({
                    color: 0x90a4ae,
                    roughness: 0.1,
                    metalness: 0.4,
                    side: THREE.DoubleSide,
                    flatShading: false
                });

                mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                loading.style.display = 'none';
                exportBtn.disabled = false;
            }, 50);
        }

        function exportSTLFast() {
            if (!mesh) return;
            loading.style.display = 'block';
            loading.innerText = '⚡ Đang xuất file STL xám bạc...';

            setTimeout(() => {
                const exporter = new THREE.STLExporter();
                const result = exporter.parse(mesh, { binary: true });
                
                const blob = new Blob([result], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'heightmap_silver_gray.stl';
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                loading.style.display = 'none';
            }, 50);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
