<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tải Ảnh Lên Google Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        #upload-panel { display: none; }
        .preview-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body class="py-5">

    <div class="container" style="max-width: 750px;">
        <div id="upload-panel" class="card shadow p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold text-primary mb-0"><i class="fas fa-cloud-upload-alt me-2"></i>Tải Ảnh Lên Google Drive</h4>
                <button onclick="logout()" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Thoát</button>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Chọn ảnh từ máy tính:</label>
                <input type="file" id="imageInput" class="form-control" accept="image/*" onchange="uploadImage(event)">
            </div>

            <div id="loading" class="text-center text-primary mb-3" style="display: none;">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>Đang tải ảnh lên Google Drive, vui lòng chờ...
            </div>

            <!-- Khu vực hiển thị kết quả ảnh vừa tải -->
            <div id="result-box" class="card bg-light p-3 mb-4" style="display: none;">
                <label class="form-label text-success small fw-bold"><i class="fas fa-check-circle me-1"></i>Tải ảnh thành công! Link trực tiếp:</label>
                <div class="input-group mb-3">
                    <input type="text" id="resultUrl" class="form-control" readonly>
                    <button class="btn btn-success" onclick="copyLink()"><i class="fas fa-copy"></i> Sao chép</button>
                </div>
                <div class="text-center">
                    <img id="previewImg" src="" class="img-thumbnail rounded shadow-sm" style="max-height: 150px; object-fit: cover;">
                </div>
            </div>

            <!-- Lịch sử ảnh đã tải trong phiên -->
            <hr>
            <h5 class="fw-bold mb-3 text-dark fs-6"><i class="fas fa-history me-2"></i>Lịch sử tải ảnh trong phiên làm việc</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Ảnh</th>
                            <th>Đường dẫn (Link)</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="3" class="text-center text-muted small">Chưa có ảnh nào được tải lên trong phiên này.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Link Web App Google Apps Script của bạn
        const API_URL = "https://script.google.com/macros/s/AKfycbyJjAqNJAD3RffOXk48q7aWmChmtuDhCQUncxnfrkiWT-r3gWsPaO9HfG-8UAwaUcs/exec";
        const PASSWORD = "Ttm20073094@"; // Mật khẩu truy cập trang
        let uploadedImages = [];

        window.onload = () => {
            if (sessionStorage.getItem("upload_auth") === PASSWORD) {
                document.getElementById("upload-panel").style.display = "block";
            } else {
                let p = prompt("Nhập mật khẩu truy cập trang tải ảnh:");
                if (p === PASSWORD) { 
                    sessionStorage.setItem("upload_auth", PASSWORD); 
                    document.getElementById("upload-panel").style.display = "block";
                } else { 
                    alert("Sai mật khẩu!"); 
                    location.href = "index.html"; 
                }
            }
        };

        function logout() { 
            sessionStorage.removeItem("upload_auth"); 
            location.href = "index.html"; 
        }

        function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById("loading").style.display = "block";
            document.getElementById("result-box").style.display = "none";

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;

                // Sử dụng kỹ thuật JSONP / Image / hoặc tạo form ẩn để nhận phản hồi xuyên tên miền không bị chặn CORS
                fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "uploadImage",
                        fileData: base64Data,
                        mimeType: file.type,
                        fileName: file.name
                    })
                })
                .then(response => response.json())
                .then(result => {
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("imageInput").value = ""; 

                    if (result.status === "success") {
                        document.getElementById("result-box").style.display = "block";
                        document.getElementById("resultUrl").value = result.url;
                        document.getElementById("previewImg").src = result.url;

                        uploadedImages.unshift({ url: result.url, name: file.name });
                        renderHistory();
                    } else {
                        alert("Lỗi từ server: " + (result.message || "Không thể tải lên"));
                    }
                })
                .catch(error => {
                    console.error("Lỗi:", error);
                    document.getElementById("loading").style.display = "none";
                    alert("Có lỗi kết nối tới server Google Apps Script!");
                });
            };
            reader.readAsDataURL(file);
        }

        function renderHistory() {
            const tbody = document.getElementById("history-tbody");
            tbody.innerHTML = uploadedImages.map((item) => `
                <tr>
                    <td><img src="${item.url}" class="preview-thumb"></td>
                    <td><input type="text" class="form-control form-control-sm" value="${item.url}" readonly></td>
                    <td class="text-center text-nowrap">
                        <a href="${item.url}" target="_blank" class="btn btn-sm btn-info text-white me-1" title="Xem ảnh"><i class="fas fa-eye"></i></a>
                        <button class="btn btn-sm btn-success" onclick="copySpecificLink('${item.url}')" title="Copy Link"><i class="fas fa-copy"></i></button>
                    </td>
                </tr>
            `).join("");
        }

        function copyLink() {
            const copyText = document.getElementById("resultUrl");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Đã sao chép link thành công!");
        }

        function copySpecificLink(url) {
            navigator.clipboard.writeText(url);
            alert("Đã sao chép link thành công!");
        }
    </script>
</body>
</html>
