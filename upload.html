<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tải Ảnh Lên Google Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        #upload-panel { display: none; }
    </style>
</head>
<body class="py-5">

    <div class="container" style="max-width: 700px;">
        <div id="upload-panel" class="card shadow p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold text-primary mb-0"><i class="fas fa-cloud-upload-alt me-2"></i>Tải Ảnh Lên Google Drive</h4>
                <button onclick="logout()" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Thoát</button>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Chọn ảnh từ máy tính:</label>
                <input type="file" id="imageInput" class="form-control" accept="image/*" onchange="uploadImage(event)">
            </div>

            <div id="loading" class="text-center text-primary mb-3" style="display: none;">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>Đang đẩy ảnh lên Google Drive, vui lòng chờ...
            </div>

            <div class="alert alert-info small mb-0">
                <i class="fas fa-info-circle me-1"></i> <strong>Lưu ý:</strong> Ảnh sẽ được tự động lưu vào thư mục <strong>DoGoTruongVinh_Uploads</strong> trên Google Drive của bạn. Bạn có thể mở Drive để lấy link trực tiếp sử dụng cho web.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Link Web App Google Apps Script của bạn
        const API_URL = "https://script.google.com/macros/s/AKfycbwsdMkt0vI1HvMayBKNEALwQK2zllw4f2WLk77Z5CCSFWdsaldymv29D6o_h8bKZ_4/exec";
        const PASSWORD = "Ttm20073094@"; // Mật khẩu truy cập trang

        window.onload = () => {
            if (sessionStorage.getItem("upload_auth") === PASSWORD) {
                document.getElementById("upload-panel").style.display = "block";
            } else {
                let p = prompt("Nhập mật khẩu truy cập trang tải ảnh:");
                if (p === PASSWORD) { 
                    sessionStorage.setItem("upload_auth", PASSWORD); 
                    document.getElementById("upload-panel").style.display = "block";
                } else { 
                    alert("Sai mật khẩu!"); 
                    location.href = "index.html"; 
                }
            }
        };

        function logout() { 
            sessionStorage.removeItem("upload_auth"); 
            location.href = "index.html"; 
        }

        function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById("loading").style.display = "block";

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;

                // Sử dụng fetch với no-cors và .then() để tránh hoàn toàn lỗi đọc response (CORS)
                fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: JSON.stringify({
                        action: "uploadImage",
                        fileData: base64Data,
                        mimeType: file.type,
                        fileName: file.name
                    })
                }).then(() => {
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("imageInput").value = ""; 
                    alert("Đã gửi ảnh lên Google Drive thành công! Vui lòng kiểm tra thư mục 'DoGoTruongVinh_Uploads' trên Google Drive.");
                }).catch(error => {
                    console.error("Lỗi:", error);
                    document.getElementById("loading").style.display = "none";
                    alert("Đã gửi lệnh lên server. Hãy kiểm tra Google Drive xem ảnh đã vào thư mục chưa nhé!");
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
