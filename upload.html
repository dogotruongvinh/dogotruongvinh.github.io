<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Ảnh Lên GitHub & Lấy Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .upload-card { max-width: 600px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .preview-img { max-height: 200px; object-fit: contain; width: 100%; border-radius: 8px; border: 1px dashed #ddd; padding: 5px; }
        #upload-panel { display: none; } /* Mặc định ẩn giao diện đi */
    </style>
</head>
<body>

    <div class="container">
        <div id="upload-panel" class="upload-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-primary m-0"><i class="fas fa-cloud-upload-alt me-2"></i>Tải Ảnh Lên GitHub</h3>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm"><i class="fas fa-sign-out-alt me-1"></i>Thoát</button>
            </div>
            
            <!-- Cấu hình GitHub -->
            <div class="card bg-light p-3 mb-3 border-0">
                <h6 class="fw-bold text-secondary mb-2"><i class="fas fa-cog me-1"></i> Cấu hình GitHub cá nhân:</h6>
                <div class="mb-2">
                    <input type="text" id="repoOwner" class="form-control form-control-sm" placeholder="Tên tài khoản GitHub (ví dụ: dogotruongvinh)">
                </div>
                <div class="mb-2">
                    <input type="text" id="repoName" class="form-control form-control-sm" placeholder="Tên Repository (ví dụ: my-website hoặc dogotruongvinh.github.io)">
                </div>
                <div class="mb-0">
                    <input type="password" id="githubToken" class="form-control form-control-sm" placeholder="GitHub Personal Access Token (ghp_...)">
                    <div class="form-text small text-muted">Token cần có quyền truy cập repo (scope: repo).</div>
                </div>
            </div>

            <!-- Chọn file ảnh -->
            <div class="mb-3">
                <label class="form-label fw-bold text-muted small">Chọn ảnh từ máy tính:</label>
                <input type="file" id="imageInput" class="form-control" accept="image/*" onchange="previewFile()">
            </div>

            <!-- Khung xem trước ảnh -->
            <div class="text-center mb-3">
                <img id="preview" src="" class="preview-img" style="display:none;">
            </div>

            <!-- Nút thực hiện tải lên -->
            <button id="uploadBtn" class="btn btn-primary w-100 py-2 fw-bold" onclick="uploadToGitHub()" disabled>
                <i class="fas fa-upload me-1"></i> Tải Lên GitHub & Lấy Link
            </button>

            <!-- Trạng thái -->
            <div id="status" class="text-center text-muted mt-3 small"></div>

            <!-- Khu vực nhận kết quả Link ảnh -->
            <div id="resultBox" class="mt-4 p-3 bg-success bg-opacity-10 rounded border border-success" style="display:none;">
                <label class="form-label fw-bold text-success small mb-1"><i class="fas fa-check-circle me-1"></i> Tải lên thành công! Link ảnh của bạn:</label>
                <div class="input-group mb-2">
                    <input type="text" id="resultUrl" class="form-control bg-white" readonly>
                    <button class="btn btn-success" onclick="copyLink()"><i class="fas fa-copy me-1"></i> Sao chép</button>
                </div>
                <div class="form-text text-success small">Bạn có thể copy link trên dán trực tiếp vào thuộc tính `src` của thẻ `<img>` trên web.</div>
            </div>
        </div>
    </div>

    <script>
        // Mật khẩu bảo vệ (Bạn có thể đổi chuỗi bên trong dấu nháy)
        const PASSWORD = "Ttm20073094@"; 

        // Kiểm tra mật khẩu ngay khi mở trang
        window.onload = () => {
            if (sessionStorage.getItem("upload_auth") === PASSWORD) {
                document.getElementById("upload-panel").style.display = "block";
                loadConfig();
            } else {
                let p = prompt("Nhập mật khẩu để truy cập trang tải ảnh:");
                if (p === PASSWORD) {
                    sessionStorage.setItem("upload_auth", PASSWORD);
                    document.getElementById("upload-panel").style.display = "block";
                    loadConfig();
                } else {
                    alert("Sai mật khẩu!");
                    location.href = "index.html"; // Sai thì đá về trang chủ
                }
            }
        };

        function logout() {
            sessionStorage.removeItem("upload_auth");
            location.href = "index.html";
        }

        function loadConfig() {
            if(localStorage.getItem('gh_owner')) document.getElementById('repoOwner').value = localStorage.getItem('gh_owner');
            if(localStorage.getItem('gh_repo')) document.getElementById('repoName').value = localStorage.getItem('gh_repo');
            if(localStorage.getItem('gh_token')) document.getElementById('githubToken').value = localStorage.getItem('gh_token');
        }

        let base64Data = "";
        let selectedFileName = "";

        function previewFile() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            if (!file) return;

            selectedFileName = Date.now() + "_" + file.name.replace(/\s+/g, '_'); 
            const reader = new FileReader();
            
            reader.onload = function(e) {
                base64Data = e.target.result.split(',')[1]; 
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('uploadBtn').removeAttribute('disabled');
            };
            reader.readAsDataURL(file);
        }

        async function uploadToGitHub() {
            let ownerInput = document.getElementById('repoOwner').value.trim();
            let repoInput = document.getElementById('repoName').value.trim();
            const token = document.getElementById('githubToken').value.trim();

            if (!ownerInput || !repoInput || !token) {
                alert("Vui lòng điền đầy đủ thông tin Tên tài khoản, Tên Repository và GitHub Token!");
                return;
            }

            const owner = ownerInput.replace('https://github.com/', '').split('/')[0];
            let repo = repoInput.replace('https://github.com/', '').split('/').pop().replace('.git', '');
            if (repo.includes('/')) repo = repo.split('/')[0];

            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            document.getElementById('status').innerText = "Đang đẩy ảnh lên GitHub, vui lòng chờ...";
            document.getElementById('uploadBtn').setAttribute('disabled', 'true');
            document.getElementById('resultBox').style.display = 'none';

            const filePath = `images/${selectedFileName}`;
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;

            const payload = {
                message: `Upload image ${selectedFileName} via web tool`,
                content: base64Data
            };

            try {
                const response = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json",
                        "Accept": "vnd.github+json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('status').innerText = "Tải lên thành công!";
                    const imageUrl = `https://${owner}.github.io/${repo}/images/${selectedFileName}`;
                    document.getElementById('resultUrl').value = imageUrl;
                    document.getElementById('resultBox').style.display = 'block';
                } else {
                    document.getElementById('status').innerText = "Lỗi: " + (result.message || "Không thể tải lên");
                }
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('status').innerText = "Lỗi kết nối tới GitHub API!";
            } finally {
                document.getElementById('uploadBtn').removeAttribute('disabled');
            }
        }

        function copyLink() {
            const copyText = document.getElementById('resultUrl');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Đã sao chép link vào bộ nhớ tạm!");
        }
    </script>
</body>
</html>
