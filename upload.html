<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Ảnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container" style="max-width: 500px;">
        <input type="file" id="imageInput" class="form-control mb-3" accept="image/*">
        <button class="btn btn-primary w-100" onclick="upload()">Tải lên & Lấy Link</button>
        
        <div id="status" class="mt-3"></div>
        <div id="result" class="mt-3" style="display:none;">
            <label>Link ảnh (Copy để dán vào web):</label>
            <input type="text" id="finalUrl" class="form-control mb-2" readonly>
            <button class="btn btn-success w-100" onclick="copy()">Sao chép Link</button>
        </div>
    </div>

    <script>
        // DÁN LINK EXEC MỚI NHẤT VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/....../exec"; 

        async function upload() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return alert("Chọn ảnh đi!");
            document.getElementById('status').innerText = "Đang tải...";
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ fileData: e.target.result, mimeType: file.type, fileName: file.name })
                });
                const result = await response.json();
                if(result.status === "success") {
                    document.getElementById('status').innerText = "Thành công!";
                    document.getElementById('result').style.display = "block";
                    document.getElementById('finalUrl').value = result.url;
                }
            };
            reader.readAsDataURL(file);
        }

        function copy() {
            document.getElementById('finalUrl').select();
            document.execCommand("copy");
            alert("Đã copy link!");
        }
    </script>
</body>
</html>
