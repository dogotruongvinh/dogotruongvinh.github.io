<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Ảnh Lên Google Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container bg-white p-4 rounded shadow" style="max-width: 500px;">
        <h4 class="mb-3 text-primary">Tải Ảnh Lên Google Drive</h4>
        
        <div class="mb-3">
            <input type="file" id="imageInput" class="form-control" accept="image/*">
        </div>
        <button class="btn btn-primary w-100 mb-3" onclick="upload()">Tải lên & Lấy Link</button>
        
        <div id="status" class="text-center text-muted fw-bold mb-2"></div>
        
        <div id="result" class="mb-3" style="display:none;">
            <label class="form-label small fw-bold text-success">Link ảnh trực tiếp (Copy dán vào web):</label>
            <div class="input-group mb-2">
                <input type="text" id="finalUrl" class="form-control" readonly>
                <button class="btn btn-success" onclick="copyLink()">Sao chép</button>
            </div>
            <div class="text-center">
                <img id="preview" src="" class="img-thumbnail mt-2" style="max-height: 120px;">
            </div>
        </div>
    </div>

    <script>
        // 👉 THAY LINK /exec CHUẨN CỦA BẠN VÀO ĐÂY (Không dùng dấu ... nữa)
        const API_URL = "https://script.google.com/macros/s/AKfycbyZ6POB_04r2jX-psm_GpUHHEVS0_tmgA686CKKtZ1uTe-6FkKP_lbPZW88T61sUvk/exec"; 

        async function upload() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("Vui lòng chọn một hình ảnh!");
                return;
            }

            document.getElementById('status').innerText = "Đang tải ảnh lên, vui lòng chờ...";
            document.getElementById('result').style.display = "none";

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const response = await fetch(API_URL, {
                        method: "POST",
                        redirect: "follow",
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8",
                        },
                        body: JSON.stringify({
                            action: "uploadImage",
                            fileData: e.target.result,
                            mimeType: file.type,
                            fileName: file.name
                        })
                    });

                    const result = await response.json();
                    
                    if(result.status === "success") {
                        document.getElementById('status').innerText = "Tải ảnh thành công!";
                        document.getElementById('result').style.display = "block";
                        document.getElementById('finalUrl').value = result.url;
                        document.getElementById('preview').src = result.url;
                        fileInput.value = ""; // Reset input
                    } else {
                        document.getElementById('status').innerText = "Lỗi: " + result.message;
                    }
                } catch (error) {
                    console.error("Lỗi:", error);
                    document.getElementById('status').innerText = "";
                    alert("Lỗi kết nối! Hãy chắc chắn bạn đã dán đúng link API_URL kết thúc bằng /exec và đã bấm Deploy (New version).");
                }
            };
            reader.readAsDataURL(file);
        }

        function copyLink() {
            const copyText = document.getElementById('finalUrl');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Đã sao chép link thành công!");
        }
    </script>
</body>
</html>
