<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - Đồ Gỗ Trường Vinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        #admin-panel { display: none; }
    </style>
</head>
<body>

    <div id="admin-panel" class="container my-4">
        <nav class="navbar navbar-dark bg-dark rounded shadow-sm mb-4 px-3">
            <span class="navbar-brand fw-bold"><i class="fas fa-lock me-2"></i>QUẢN TRỊ WEBSITE</span>
            <div>
                <button onclick="logout()" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Thoát</button>
            </div>
        </nav>

        <!-- Cấu hình chung -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">Cấu Hình Website</div>
            <div class="card-body">
                <form id="settings-form">
                    <div class="row">
                        <div class="col-md-6 mb-2"><input type="text" id="set-title" class="form-control" placeholder="Tiêu đề trang chủ"></div>
                        <div class="col-md-6 mb-2"><input type="text" id="set-desc" class="form-control" placeholder="Mô tả trang chủ"></div>
                        <div class="col-md-6 mb-2"><input type="text" id="set-herobg" class="form-control" placeholder="Link ảnh nền Hero"></div>
                        <div class="col-md-6 mb-2"><input type="text" id="set-aboutimg" class="form-control" placeholder="Link ảnh giới thiệu"></div>
                    </div>
                    <textarea id="set-about" class="form-control mb-2" placeholder="Nội dung giới thiệu" rows="3"></textarea>
                    <button type="submit" class="btn btn-primary btn-sm" id="btn-save-settings">Lưu cấu hình</button>
                </form>
            </div>
        </div>

        <!-- Quản lý Danh Mục -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <span class="fw-bold">Quản Lý Danh Mục Sản Phẩm</span>
                <button class="btn btn-light btn-sm fw-bold" onclick="showCategoryModal()">+ Thêm Danh Mục</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light"><tr><th>Tên Danh Mục</th><th class="text-center">Thao tác</th></tr></thead>
                    <tbody id="category-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Quản lý Sản Phẩm -->
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <span class="fw-bold">Danh Sách Sản Phẩm</span>
                <button class="btn btn-light btn-sm fw-bold" onclick="showProductModal()">+ Thêm Sản Phẩm</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>Ảnh</th><th>Tên</th><th>Danh mục</th><th>Giá</th><th class="text-center">Thao tác</th></tr>
                    </thead>
                    <tbody id="product-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Danh Mục -->
    <div class="modal fade" id="categoryModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-body">
        <form id="category-form">
            <input type="hidden" id="cat-index">
            <input type="hidden" id="cat-id">
            <h5 class="fw-bold mb-3">Thêm/Sửa Danh Mục</h5>
            <input type="text" id="cat-name" class="form-control mb-3" placeholder="Tên danh mục (Ví dụ: Sập Thờ, Án Gian...)" required>
            <button type="submit" class="btn btn-secondary w-100">Lưu danh mục</button>
        </form>
    </div></div></div></div>

    <!-- Modal Sản Phẩm -->
    <div class="modal fade" id="productModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-body">
        <form id="product-form">
            <input type="hidden" id="prod-index">
            <input type="hidden" id="prod-id">
            <h5 class="fw-bold mb-3">Thêm/Sửa Sản Phẩm</h5>
            <input type="text" id="prod-name" class="form-control mb-2" placeholder="Tên sản phẩm" required>
            <select id="prod-category" class="form-control mb-2" required></select>
            <input type="text" id="prod-price" class="form-control mb-2" placeholder="Giá sản phẩm" required>
            <input type="text" id="prod-image" class="form-control mb-2" placeholder="Link ảnh sản phẩm" required>
            <textarea id="prod-desc" class="form-control mb-2" placeholder="Mô tả sản phẩm" rows="3"></textarea>
            <button type="submit" class="btn btn-success w-100">Lưu sản phẩm</button>
        </form>
    </div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6IDxe8RnW0J2xsF533Q-cXkwjBjO5cPyx9L5DvIlKONXb2P_Oyp-DSVqB91pbPBU/exec";
        const PASSWORD = "Ttm20073094@"; 
        let products = [];
        let categories = [];

        window.onload = () => {
            if (sessionStorage.getItem("auth") === PASSWORD) {
                document.getElementById("admin-panel").style.display = "block";
                loadData();
            } else {
                let p = prompt("Nhập mật khẩu quản trị:");
                if (p === PASSWORD) { sessionStorage.setItem("auth", PASSWORD); location.reload(); }
                else { alert("Sai mật khẩu!"); location.href = "index.html"; }
            }
        };

        function logout() { sessionStorage.removeItem("auth"); location.href = "index.html"; }

        async function loadData() {
            try {
                const res = await fetch(API_URL + "?action=getData");
                const data = await res.json();
                document.getElementById("set-title").value = data.settings.title || "";
                document.getElementById("set-desc").value = data.settings.desc || "";
                document.getElementById("set-herobg").value = data.settings.herobg || "";
                document.getElementById("set-aboutimg").value = data.settings.aboutimg || "";
                document.getElementById("set-about").value = data.settings.about || "";
                
                products = data.products || [];
                categories = data.categories || [];
                renderCategories();
                renderProducts();
                updateCategorySelect();
            } catch (err) {
                console.error("Lỗi tải dữ liệu:", err);
            }
        }

        function renderCategories() {
            document.getElementById("category-tbody").innerHTML = categories.map((c, i) => `
                <tr>
                    <td>${c.name}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-warning me-1" onclick="editCat(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="delCat(${i})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`).join("");
        }

        function renderProducts() {
            document.getElementById("product-tbody").innerHTML = products.map((p, i) => {
                const cat = categories.find(c => c.id === p.categoryId);
                const catName = cat ? cat.name : '<span class="text-muted">Chưa phân loại</span>';
                return `
                <tr>
                    <td><img src="${p.image}" width="50" height="50" style="object-fit:cover;" class="rounded"></td>
                    <td>${p.name}</td>
                    <td>${catName}</td>
                    <td>${p.price}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-warning me-1" onclick="editProd(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="delProd(${i})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join("");
        }

        function updateCategorySelect() {
            const select = document.getElementById("prod-category");
            select.innerHTML = '<option value="">-- Chọn danh mục sản phẩm --</option>' + 
                categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
        }

        // Lưu Cấu hình
        document.getElementById("settings-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "saveSettings",
                    settings: {
                        title: document.getElementById("set-title").value,
                        desc: document.getElementById("set-desc").value,
                        herobg: document.getElementById("set-herobg").value,
                        aboutimg: document.getElementById("set-aboutimg").value,
                        about: document.getElementById("set-about").value
                    }
                })
            });
            alert("Lưu cấu hình thành công!");
        });

        // Thêm/Sửa Danh mục
        document.getElementById("category-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const index = document.getElementById("cat-index").value;
            const id = document.getElementById("cat-id").value || "cat_" + Date.now();
            const name = document.getElementById("cat-name").value;

            if (index === "") categories.push({ id, name });
            else categories[index] = { id, name };

            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveCategories", categories }) });
            renderCategories();
            updateCategorySelect();
            bootstrap.Modal.getInstance(document.getElementById("categoryModal")).hide();
            this.reset();
        });

        function showCategoryModal() {
            document.getElementById("category-form").reset();
            document.getElementById("cat-index").value = "";
            document.getElementById("cat-id").value = "";
            new bootstrap.Modal(document.getElementById("categoryModal")).show();
        }

        function editCat(i) {
            const c = categories[i];
            document.getElementById("cat-index").value = i;
            document.getElementById("cat-id").value = c.id;
            document.getElementById("cat-name").value = c.name;
            new bootstrap.Modal(document.getElementById("categoryModal")).show();
        }

        async function delCat(i) {
            if (confirm("Xóa danh mục này?")) {
                categories.splice(i, 1);
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveCategories", categories }) });
                renderCategories();
                updateCategorySelect();
            }
        }

        // Thêm/Sửa Sản phẩm
        document.getElementById("product-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const index = document.getElementById("prod-index").value;
            const id = document.getElementById("prod-id").value || Date.now().toString();
            const name = document.getElementById("prod-name").value;
            const price = document.getElementById("prod-price").value;
            const image = document.getElementById("prod-image").value;
            const desc = document.getElementById("prod-desc").value;
            const categoryId = document.getElementById("prod-category").value;

            const newProd = { id, name, price, image, desc, categoryId };
            if (index === "") products.push(newProd);
            else products[index] = newProd;

            await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveProducts", products }) });
            renderProducts();
            bootstrap.Modal.getInstance(document.getElementById("productModal")).hide();
            this.reset();
        });

        function showProductModal() {
            document.getElementById("product-form").reset();
            document.getElementById("prod-index").value = "";
            document.getElementById("prod-id").value = "";
            new bootstrap.Modal(document.getElementById("productModal")).show();
        }

        function editProd(i) {
            const p = products[i];
            document.getElementById("prod-index").value = i;
            document.getElementById("prod-id").value = p.id || "";
            document.getElementById("prod-name").value = p.name;
            document.getElementById("prod-price").value = p.price;
            document.getElementById("prod-image").value = p.image;
            document.getElementById("prod-desc").value = p.desc;
            document.getElementById("prod-category").value = p.categoryId || "";
            new bootstrap.Modal(document.getElementById("productModal")).show();
        }

        async function delProd(i) {
            if (confirm("Bạn có chắc muốn xoá sản phẩm này?")) {
                products.splice(i, 1);
                await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "saveProducts", products }) });
                renderProducts();
            }
        }
    </script>
</body>
</html>
