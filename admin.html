<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - Đồ Gỗ Trường Vinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        #admin-panel { display: none; }
    </style>
</head>
<body>

    <div id="admin-panel" class="container my-4">
        <nav class="navbar navbar-dark bg-dark rounded shadow-sm mb-4 px-3">
            <span class="navbar-brand fw-bold"><i class="fas fa-lock me-2"></i>QUẢN TRỊ WEBSITE</span>
            <div>
                <button onclick="backupData()" class="btn btn-warning btn-sm me-2"><i class="fas fa-download"></i> Backup</button>
                <label class="btn btn-info btn-sm me-2">
                    <i class="fas fa-upload"></i> Restore
                    <input type="file" id="restore-file" style="display: none;" onchange="restoreData(event)">
                </label>
                <button onclick="logout()" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Thoát</button>
            </div>
        </nav>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">Cấu Hình Website</div>
            <div class="card-body">
                <form id="settings-form">
                    <div class="row">
                        <div class="col-md-6 mb-2"><input type="text" id="set-title" class="form-control" placeholder="Tiêu đề trang chủ"></div>
                        <div class="col-md-6 mb-2"><input type="text" id="set-desc" class="form-control" placeholder="Mô tả trang chủ"></div>
                        <div class="col-md-6 mb-2"><input type="text" id="set-herobg" class="form-control" placeholder="Link ảnh nền"></div>
                        <div class="col-md-6 mb-2"><input type="text" id="set-aboutimg" class="form-control" placeholder="Link ảnh giới thiệu"></div>
                    </div>
                    <textarea id="set-about" class="form-control mb-2" placeholder="Nội dung giới thiệu" rows="3"></textarea>
                    <button type="submit" class="btn btn-primary" id="btn-save-settings">Lưu cấu hình</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <span class="fw-bold">Danh Sách Sản Phẩm</span>
                <button class="btn btn-light btn-sm fw-bold" onclick="showModal()">+ Thêm Sản Phẩm</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>Ảnh</th><th>Tên</th><th>Giá</th><th class="text-center">Thao tác</th></tr>
                    </thead>
                    <tbody id="product-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Sản Phẩm -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-body">
            <form id="product-form">
                <input type="hidden" id="prod-index">
                <input type="hidden" id="prod-id">
                <input type="text" id="prod-name" class="form-control mb-2" placeholder="Tên sản phẩm" required>
                <input type="text" id="prod-price" class="form-control mb-2" placeholder="Giá sản phẩm" required>
                <input type="text" id="prod-image" class="form-control mb-2" placeholder="Link ảnh sản phẩm" required>
                <textarea id="prod-desc" class="form-control mb-2" placeholder="Mô tả sản phẩm" rows="3"></textarea>
                <button type="submit" class="btn btn-success w-100">Lưu sản phẩm</button>
            </form>
        </div></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6IDxe8RnW0J2xsF533Q-cXkwjBjO5cPyx9L5DvIlKONXb2P_Oyp-DSVqB91pbPBU/exec";
        const PASSWORD = "Ttm20073094@"; 
        let products = [];

        window.onload = () => {
            if (sessionStorage.getItem("auth") === PASSWORD) {
                document.getElementById("admin-panel").style.display = "block";
                loadData();
            } else {
                let p = prompt("Nhập mật khẩu quản trị:");
                if (p === PASSWORD) { sessionStorage.setItem("auth", PASSWORD); location.reload(); }
                else { alert("Sai mật khẩu!"); location.href = "index.html"; }
            }
        };

        function logout() { sessionStorage.removeItem("auth"); location.href = "index.html"; }

        async function loadData() {
            try {
                const res = await fetch(API_URL + "?action=getData");
                const data = await res.json();
                document.getElementById("set-title").value = data.settings.title || "";
                document.getElementById("set-desc").value = data.settings.desc || "";
                document.getElementById("set-herobg").value = data.settings.herobg || "";
                document.getElementById("set-aboutimg").value = data.settings.aboutimg || "";
                document.getElementById("set-about").value = data.settings.about || "";
                products = data.products || [];
                renderTable();
            } catch (err) {
                console.error("Lỗi tải dữ liệu:", err);
            }
        }

        function renderTable() {
            document.getElementById("product-tbody").innerHTML = products.map((p, i) => `
                <tr>
                    <td><img src="${p.image}" width="50" height="50" style="object-fit:cover;" class="rounded"></td>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-warning me-1" onclick="editProd(${i})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="delProd(${i})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`).join("");
        }

        // 1. LƯU CẤU HÌNH WEBSITE
        document.getElementById("settings-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-save-settings");
            btn.innerText = "Đang lưu...";
            
            const settingsData = {
                action: "saveSettings",
                settings: {
                    title: document.getElementById("set-title").value,
                    desc: document.getElementById("set-desc").value,
                    herobg: document.getElementById("set-herobg").value,
                    aboutimg: document.getElementById("set-aboutimg").value,
                    about: document.getElementById("set-about").value
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(settingsData)
                });
                const result = await response.json();
                if(result.status === "success") {
                    alert("Lưu cấu hình thành công!");
                } else {
                    alert("Lưu thất bại!");
                }
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Không thể kết nối tới Google Sheets!");
            } finally {
                btn.innerText = "Lưu cấu hình";
            }
        });

        // HÀM GỬI DANH SÁCH SẢN PHẨM LÊN GOOGLE SHEETS
        async function saveProductsToSheet() {
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "saveProducts",
                        products: products
                    })
                });
            } catch (error) {
                console.error("Lỗi khi lưu sản phẩm:", error);
            }
        }

        // 2. THÊM / SỬA SẢN PHẨM
        document.getElementById("product-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const index = document.getElementById("prod-index").value;
            const id = document.getElementById("prod-id").value || Date.now().toString();
            const name = document.getElementById("prod-name").value;
            const price = document.getElementById("prod-price").value;
            const image = document.getElementById("prod-image").value;
            const desc = document.getElementById("prod-desc").value;

            if (index === "") {
                // Thêm mới
                products.push({ id, name, price, image, desc });
            } else {
                // Cập nhật
                products[index] = { id, name, price, image, desc };
            }

            await saveProductsToSheet();
            renderTable();
            
            bootstrap.Modal.getInstance(document.getElementById("productModal")).hide();
            this.reset();
            document.getElementById("prod-index").value = "";
            document.getElementById("prod-id").value = "";
            alert("Đã lưu sản phẩm thành công!");
        });

        function showModal() { 
            document.getElementById("product-form").reset();
            document.getElementById("prod-index").value = "";
            document.getElementById("prod-id").value = "";
            new bootstrap.Modal(document.getElementById("productModal")).show(); 
        }

        function editProd(i) {
            const p = products[i];
            document.getElementById("prod-index").value = i;
            document.getElementById("prod-id").value = p.id || "";
            document.getElementById("prod-name").value = p.name;
            document.getElementById("prod-price").value = p.price;
            document.getElementById("prod-image").value = p.image;
            document.getElementById("prod-desc").value = p.desc;
            new bootstrap.Modal(document.getElementById("productModal")).show();
        }

        async function delProd(i) {
            if (confirm("Bạn có chắc muốn xoá sản phẩm này?")) {
                products.splice(i, 1);
                await saveProductsToSheet();
                renderTable();
                alert("Đã xoá thành công!");
            }
        }

        // BACKUP
        function backupData() {
            const data = { 
                settings: { 
                    title: document.getElementById('set-title').value,
                    desc: document.getElementById('set-desc').value,
                    herobg: document.getElementById('set-herobg').value,
                    aboutimg: document.getElementById('set-aboutimg').value,
                    about: document.getElementById('set-about').value
                }, 
                products 
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "Backup_DoGoTruongVinh_" + new Date().toISOString().slice(0,10) + ".json";
            a.click();
        }

        // RESTORE
        async function restoreData(event) {
            const file = event.target.files[0];
            if (!file || !confirm("CẢNH BÁO: Hành động này sẽ ghi đè toàn bộ dữ liệu hiện tại!")) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const restored = JSON.parse(e.target.result);
                products = restored.products;
                await Promise.all([
                    fetch(API_URL, {method:"POST", body: JSON.stringify({action:"saveSettings", settings: restored.settings})}),
                    fetch(API_URL, {method:"POST", body: JSON.stringify({action:"saveProducts", products})})
                ]);
                alert("Khôi phục thành công!");
                loadData();
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
